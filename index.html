<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇자동화 SI 실적 비서</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>🤖 로봇자동화 SI 실적 비서</h1>
        <p class="chat-description">
            프로젝트 수주 실적을 AI에게 질문해 보세요.
        </p>
    </header>

    <div class="app-layout">

        <!-- 왼쪽 사이드바 -->
        <aside id="sidebar">
            <button id="new-chat-button">＋ 새 채팅</button>

            <!-- 실적 대시보드 메뉴 -->
            <button id="dashboard-button" type="button">
                📊 실적 대시보드
            </button>

            <h3>이전 대화</h3>
            <div id="conversation-list"></div>
        </aside>

        <!-- 오른쪽 채팅 화면 -->
        <main class="chat-main">
            <div id="chat-box">
                <p class="ai-message">AI 비서: 안녕하세요! 무엇이 궁금하신가요?</p>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="질문을 입력하세요"
                >
                <button id="send-button">전송</button>
            </div>
        </main>

        <!-- 실적 대시보드 화면 -->
        <section id="dashboard-page" hidden>
            <h2>📊 실적 대시보드</h2>
            <p>로봇자동화 SI 프로젝트 수주 실적을 확인할 수 있습니다.</p>

            <!-- 대시보드 전체 조회 연도 선택 -->
            <div class="dashboard-filter">
                <label for="dashboard-year-select">조회 기간:</label>
                <select id="dashboard-year-select">
                    <option value="all" selected>전체 기간 (2022~2026)</option>
                    <option value="2026">2026년</option>
                    <option value="2025">2025년</option>
                    <option value="2024">2024년</option>
                    <option value="2023">2023년</option>
                    <option value="2022">2022년</option>
                </select>
            </div>

            <!-- 전체 실적 요약 -->
            <div class="dashboard-summary">
                <div class="summary-card">
                    <h3>총 수주금액</h3>
                    <p id="total-order-value">-</p>
                </div>

                <div class="summary-card">
                    <h3>총 수주건수</h3>
                    <p id="total-order-count">-</p>
                </div>

                <div class="summary-card">
                    <h3>평균 수주금액</h3>
                    <p id="average-order-value">-</p>
                </div>
            </div>

            <!-- 연도별 수주 실적 그래프 -->
            <div class="dashboard-chart">
                <h3>연도별 수주금액</h3>
                <canvas id="yearly-chart"></canvas>
            </div>

            <!-- 월별 수주 실적 그래프 -->
            <div class="dashboard-chart">
                <h3>월별 수주금액 추이</h3>

                <!-- 조회 연도 선택 -->
                <label for="monthly-year-select">조회 연도:</label>
                <select id="monthly-year-select">
                    <option value="2026" selected>2026년</option>
                    <option value="2025">2025년</option>
                    <option value="2024">2024년</option>
                    <option value="2023">2023년</option>
                    <option value="2022">2022년</option>
                </select>

                <canvas id="monthly-chart"></canvas>
            </div>
            <!-- 프로젝트 유형별 수주금액 그래프 -->
            <div class="dashboard-chart">
                <h3>프로젝트 유형별 수주금액</h3>
                <canvas id="project-type-value-chart"></canvas>
            </div>

            <!-- 프로젝트 유형별 수주건수 그래프 -->
            <div class="dashboard-chart">
                <h3>프로젝트 유형별 수주건수</h3>
                <canvas id="project-type-count-chart"></canvas>
            </div>
        </section>

    </div>

    <!-- 그래프 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

    <!-- 기존 JavaScript -->
    <script src="script.js"></script>
</body>
</html>
